[project]
name = "production-ai-app"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    # N999 flags the checkout directory itself, not our code. GitHub clones into
    # a folder named after the repo ("Support-Bot"), and a hyphen is illegal in a
    # Python module name -- so every __init__.py fails in CI while passing
    # locally, where the folder is apple_support_bot. The repo root is never
    # imported as a module, so the rule does not apply here.
    "N999",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
