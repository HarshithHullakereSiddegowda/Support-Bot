<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Support Bot</title>
<style>
  :root{
    --bg:#f6f7f8; --panel:#fff; --ink:#1a1c1e; --soft:#4a5258; --muted:#6b757c;
    --rule:#e2e6e9; --accent:#1f6f8b; --accent-w:#e6f0f4;
    --pass:#2f6b45; --fail:#a1372f; --warn:#8a5a09; --bubble:#eef1f3;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#111416; --panel:#191d20; --ink:#e8ecee; --soft:#c0c8cd; --muted:#8b959c;
    --rule:#2a3034; --accent:#6fb6cf; --accent-w:#1a2d35;
    --pass:#6fb388; --fail:#dd8078; --warn:#d7a445; --bubble:#222830;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;height:100vh}
  header{background:var(--panel);border-bottom:1px solid var(--rule);
         padding:.7rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
  header h1{font-size:1rem;margin:0;font-weight:600}
  header .sp{flex:1}
  select,button,input{font:inherit;color:inherit}
  select,input[type=password]{background:var(--bg);border:1px solid var(--rule);
      border-radius:6px;padding:.4rem .55rem;max-width:15rem}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;
      padding:.45rem .85rem;cursor:pointer;font-weight:500}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--rule)}
  #log{flex:1;overflow-y:auto;padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1rem}
  .turn{max-width:48rem;width:100%;margin:0 auto}
  .me{display:flex;justify-content:flex-end}
  .me .b{background:var(--accent);color:#fff;border-radius:14px 14px 3px 14px;
         padding:.55rem .9rem;max-width:80%;white-space:pre-wrap}
  .bot .b{background:var(--panel);border:1px solid var(--rule);border-radius:14px 14px 14px 3px;
          padding:.75rem 1rem}
  .bot .b p{margin:.5rem 0}
  .bot .b p:first-child{margin-top:0}.bot .b p:last-child{margin-bottom:0}
  .bot .b ol,.bot .b ul{margin:.5rem 0;padding-left:1.4rem}
  .bot .b strong{font-weight:600}
  .bot .b code{font-family:var(--mono);font-size:.86em;background:var(--bubble);padding:.05rem .3rem;border-radius:3px}
  .steps{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-bottom:.5rem}
  .steps .dot{display:inline-block;width:.42rem;height:.42rem;border-radius:50%;
              background:var(--accent);margin-right:.45rem;vertical-align:middle;
              animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.steps .dot{animation:none}}
  .scores{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem;
          padding-top:.6rem;border-top:1px solid var(--rule)}
  .pill{font-family:var(--mono);font-size:.7rem;padding:.16rem .45rem;border-radius:4px;
        background:var(--bubble);color:var(--soft)}
  .pill.ok{color:var(--pass)} .pill.no{color:var(--fail)}
  .err{color:var(--fail);font-size:.9rem}
  footer{background:var(--panel);border-top:1px solid var(--rule);padding:.75rem 1rem}
  .composer{max-width:48rem;margin:0 auto;display:flex;gap:.6rem;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--bg);border:1px solid var(--rule);
           border-radius:10px;padding:.6rem .75rem;font:inherit;color:inherit;
           max-height:9rem;min-height:2.6rem}
  .hint{max-width:48rem;margin:.45rem auto 0;font-size:.74rem;color:var(--muted)}
  [hidden]{display:none!important}   /* an explicit display: below would otherwise win */
  #gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9}
  #gate .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
              padding:1.6rem;width:min(21rem,90vw);display:flex;flex-direction:column;gap:.7rem}
  #gate h2{margin:0;font-size:1.05rem}
  #gate p{margin:0;font-size:.85rem;color:var(--muted)}
  .up{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>

<div id="gate"><form class="card" id="gateForm">
  <h2>Apple Support Bot</h2>
  <p>Enter the access password. The page exchanges it for a token so you never handle one.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Continue</button>
  <p class="err" id="gateErr" hidden></p>
</form></div>

<header>
  <h1>Apple Support Bot</h1>
  <span class="sp"></span>
  <label class="up">Corpus
    <select id="docs"><option value="">loading…</option></select>
  </label>
  <button class="ghost" id="upBtn" type="button">Upload PDF</button>
  <input type="file" id="file" accept="application/pdf" hidden>
  <button class="ghost" id="newBtn" type="button">New chat</button>
</header>

<div id="log"></div>

<footer>
  <div class="composer">
    <textarea id="q" rows="1" placeholder="Ask about your iPhone…"></textarea>
    <button id="send" type="button">Send</button>
  </div>
  <div class="hint" id="hint">First message may take ~20s while the service wakes. Answers stream as they are written; scores appear once both judges finish.</div>
</footer>

<script>
const $ = s => document.querySelector(s);
const log = $('#log');
let token = null, sessionId = null, busy = false;

try { token = sessionStorage.getItem('sb_token'); } catch (e) {}
if (token) { $('#gate').hidden = true; loadDocs(); }

// ── login ──────────────────────────────────────────────────────────────────
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#gateErr').hidden = true;
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const r = await fetch('/auth/token', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: $('#pw').value})
    });
    if (!r.ok) { const d = await r.json().catch(() => ({}));
      $('#gateErr').textContent = d.detail || 'Login failed'; $('#gateErr').hidden = false;
      btn.disabled = false; btn.textContent = 'Continue'; return; }
    token = (await r.json()).token;
    try { sessionStorage.setItem('sb_token', token); } catch (e) {}
    $('#gate').hidden = true;
    loadDocs();
  } catch (err) {
    $('#gateErr').textContent = 'Could not reach the server: ' + (err.message || err);
    $('#gateErr').hidden = false;
  } finally {
    btn.disabled = false; btn.textContent = 'Continue';
  }
});

function auth() { return {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}; }

// ── corpora ────────────────────────────────────────────────────────────────
async function loadDocs(selected) {
  try {
    const r = await fetch('/documents', {headers: {'Authorization': 'Bearer ' + token}});
    if (!r.ok) throw new Error();
    const {documents} = await r.json();
    const sel = $('#docs');
    sel.innerHTML = '';
    if (!documents.length) { sel.innerHTML = '<option value="">none indexed</option>'; return; }
    for (const d of documents) {
      const o = document.createElement('option');
      o.value = d.doc_id; o.textContent = d.title.slice(0, 44);
      sel.appendChild(o);
    }
    if (selected) sel.value = selected;
  } catch (e) { $('#docs').innerHTML = '<option value="">unavailable</option>'; }
}

// ── rendering ──────────────────────────────────────────────────────────────
function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

// Deliberately tiny: bold, inline code, headings, numbered and bulleted lists,
// paragraphs. Built from escaped text so model output can never inject markup.
function md(src) {
  const lines = esc(src).split('\n');
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (let raw of lines) {
    let l = raw.trim();
    l = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
    if (!l) { close(); continue; }
    const h = l.match(/^#{1,6}\s+(.*)$/);
    if (h) { close(); html += `<p><strong>${h[1]}</strong></p>`; continue; }
    const ol = l.match(/^\d+[.)]\s+(.*)$/);
    if (ol) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${ol[1]}</li>`; continue; }
    const ul = l.match(/^[-*]\s+(.*)$/);
    if (ul) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${ul[1]}</li>`; continue; }
    close(); html += `<p>${l}</p>`;
  }
  close();
  return html;
}

function addTurn(cls) {
  const t = document.createElement('div');
  t.className = 'turn ' + cls;
  log.appendChild(t);
  return t;
}
function scrollDown() { log.scrollTop = log.scrollHeight; }

// ── ask ────────────────────────────────────────────────────────────────────
async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true; $('#send').disabled = true;

  const mine = addTurn('me'); mine.innerHTML = `<div class="b">${esc(text)}</div>`;
  const bot = addTurn('bot');
  bot.innerHTML = `<div class="b"><div class="steps"><span class="dot"></span><span class="lbl">Starting…</span></div><div class="ans"></div></div>`;
  const stepLbl = bot.querySelector('.lbl'), steps = bot.querySelector('.steps'), ans = bot.querySelector('.ans');
  scrollDown();

  let acc = '';
  try {
    const r = await fetch('/query/stream', {
      method: 'POST', headers: auth(),
      body: JSON.stringify({query: text, session_id: sessionId, doc_id: $('#docs').value || null})
    });
    if (!r.ok || !r.body) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || ('HTTP ' + r.status));
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const line = p.split('\n').find(x => x.startsWith('data: '));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch (e) { continue; }

        if (ev.type === 'step') { stepLbl.textContent = ev.label; }
        else if (ev.type === 'token') { acc += ev.text; ans.innerHTML = md(acc); scrollDown(); }
        else if (ev.type === 'answer') { acc = ev.text; ans.innerHTML = md(acc); scrollDown(); }
        else if (ev.type === 'error') {
          steps.remove();
          ans.innerHTML = `<div class="err">${esc(ev.message)}</div>`;
        }
        else if (ev.type === 'done') {
          steps.remove();
          sessionId = ev.session_id;
          const f = ev.faithfulness, c = ev.completeness;
          const pills = [
            `<span class="pill ${f >= 0.7 ? 'ok' : 'no'}" title="How much of the answer is supported by the selected document">grounded ${(f * 100).toFixed(0)}%</span>`,
            `<span class="pill ${c >= 0.6 ? 'ok' : 'no'}" title="Whether every part of the question was answered">complete ${(c * 100).toFixed(0)}%</span>`,
            `<span class="pill">${esc(ev.model_used || '—')}</span>`
          ];
          if (ev.num_sub_queries > 1) pills.push(`<span class="pill">${ev.num_sub_queries} parts</span>`);
          if (ev.pii_found && ev.pii_found.length) pills.push(`<span class="pill">PII removed: ${esc(ev.pii_found.join(', '))}</span>`);
          if (!ev.validation_passed) pills.push('<span class="pill no">below threshold</span>');
          const d = document.createElement('div'); d.className = 'scores'; d.innerHTML = pills.join('');
          bot.querySelector('.b').appendChild(d);
          scrollDown();
        }
      }
    }
    if (!acc && steps.isConnected) { steps.remove(); ans.innerHTML = '<div class="err">No answer was produced.</div>'; }
  } catch (err) {
    if (steps.isConnected) steps.remove();
    ans.innerHTML = `<div class="err">${esc(err.message || 'Request failed')}</div>`;
  } finally {
    busy = false; $('#send').disabled = false; scrollDown();
  }
}

// ── upload ─────────────────────────────────────────────────────────────────
$('#upBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const bot = addTurn('bot');
  bot.innerHTML = `<div class="b"><div class="steps"><span class="dot"></span><span class="lbl">Uploading ${esc(f.name)}</span></div><div class="ans"></div></div>`;
  const stepLbl = bot.querySelector('.lbl'), steps = bot.querySelector('.steps'), ans = bot.querySelector('.ans');
  scrollDown();

  const fd = new FormData(); fd.append('file', f);
  try {
    const r = await fetch('/documents/upload', {
      method: 'POST', headers: {'Authorization': 'Bearer ' + token}, body: fd
    });
    if (!r.ok || !r.body) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || ('HTTP ' + r.status)); }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const line = p.split('\n').find(x => x.startsWith('data: '));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch (e) { continue; }
        if (ev.type === 'step') stepLbl.textContent = ev.label;
        else if (ev.type === 'error') { steps.remove(); ans.innerHTML = `<div class="err">${esc(ev.message)}</div>`; }
        else if (ev.type === 'indexed') {
          steps.remove();
          ans.innerHTML = `<p>Indexed <strong>${esc(ev.title)}</strong> as <code>${esc(ev.doc_id)}</code> — ${ev.nodes} sections. It is now selected as the corpus.</p>`;
          await loadDocs(ev.doc_id);
        }
        scrollDown();
      }
    }
  } catch (err) {
    if (steps.isConnected) steps.remove();
    ans.innerHTML = `<div class="err">${esc(err.message || 'Upload failed')}</div>`;
  }
});

// ── composer ───────────────────────────────────────────────────────────────
const q = $('#q');
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 144) + 'px'; });
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const t = q.value; q.value = ''; q.style.height = 'auto'; ask(t); }
});
$('#send').addEventListener('click', () => { const t = q.value; q.value = ''; q.style.height = 'auto'; ask(t); });
$('#newBtn').addEventListener('click', () => { sessionId = null; log.innerHTML = ''; q.focus(); });
</script>
</body>
</html>
