
services:

  # ── Main application ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      # Without this every environment writes traces into the "default" project,
      # so local runs, CI and production are impossible to tell apart.
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-apple-support-bot-local}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - PAGEINDEX_API_KEY=${PAGEINDEX_API_KEY}
      - LOW_COMPLEXITY_MODEL=${LOW_COMPLEXITY_MODEL:-gemini-3.5-flash}
      - HIGH_COMPLEXITY_MODEL=${HIGH_COMPLEXITY_MODEL:-gemini-3.8-flash}
      - UTILITY_MODEL=${UTILITY_MODEL:-gemini-3.5-flash}
      - GPTCACHE_URL=http://gptcache:8000
      - RIVAL_URL=http://rival-service:8002
      - MONGODB_URI=mongodb://mongodb:27017
      - POSTGRES_DSN=postgresql://postgres:postgres@postgres:5432/support_bot
    depends_on:
      rival-service:
        condition: service_healthy
      gptcache:
        condition: service_started
      mongodb:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Rival AI attack detection microservice ──────────────────────────────────
  rival-service:
    build:
      context: ./services/rival_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    healthcheck:
      # python:3.11-slim ships no curl — the old `curl -f` test could never pass,
      # so the container sat "unhealthy" forever and blocked `app` via depends_on.
      # urllib is in the stdlib, so this needs nothing extra installed.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Bhairava-0.4B (~2GB) is pulled from the HF Hub on FIRST boot, not at
      # build time, so a cold start is a multi-minute download. 30s marked the
      # service unhealthy mid-download and blocked `app` from ever starting.
      # Proper fix: bake the model into the image at build time (see Dockerfile).
      start_period: 900s
    volumes:
      # Without this the 1.5GB Bhairava download lives in the container's
      # ephemeral layer and is lost on every `docker compose up --force-recreate`.
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 2G      # Bhairava-0.4B needs room; don't share with main app
    restart: unless-stopped

  # ── GPTCache semantic cache server ──────────────────────────────────────────
  gptcache:
    image: zilliz/gptcache:latest
    ports:
      - "8001:8000"
    volumes:
      - gptcache_data:/data
    restart: unless-stopped

  # ── MongoDB — PageIndex document trees ─────────────────────────────────────
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ── PostgreSQL — LangGraph session checkpointer ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  hf_cache:
  mongo_data:
  pg_data:
  gptcache_data:
